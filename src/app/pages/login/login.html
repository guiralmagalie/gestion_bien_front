<div class="login-wrapper">
  <div class="login-container">

    <img src="assets/logo.png" class="logo" alt="Logo ASN Technology">

    <h1>Gestion des biens</h1>
    <h2>Connexion</h2>

    <label>Nom d'utilisateur</label>
    <input [(ngModel)]="username" name="username" placeholder="Entrez votre nom" />

    <label>Mot de passe</label>
    <input type="password" [(ngModel)]="password" name="password" placeholder="Entrez votre mot de passe"/>

    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <button (click)="login()">Se connecter</button>

  </div>
</div>
